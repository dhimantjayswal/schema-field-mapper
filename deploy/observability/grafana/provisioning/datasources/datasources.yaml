# Provisions Prometheus/Loki/Tempo with trace<->log correlation wired
# (Architecture doc §2.1 / §6) so a log line's trace_id links straight to
# its Tempo trace, and vice versa — once the app actually emits trace_ids
# (backlog item P0-2), this is what makes clicking through them free.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":"(\w+)"'
          name: TraceID
          url: "$${__value.raw}"
    editable: true

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
      serviceMap:
        datasourceUid: prometheus
    editable: true

  # Points at Langfuse's own ClickHouse store — real token/cost/latency
  # data from every traced LLM call (P0-5), queryable directly. This is
  # what backs the "LLM Operations" dashboard; it doesn't need P0-1/P0-2/
  # P0-3 app instrumentation to have real data to show.
  - name: Langfuse ClickHouse
    type: grafana-clickhouse-datasource
    uid: langfuse-clickhouse
    access: proxy
    jsonData:
      host: langfuse-clickhouse
      port: 8123
      protocol: http
      secure: false
      defaultDatabase: default
      username: clickhouse
    secureJsonData:
      password: clickhouse
    editable: true
