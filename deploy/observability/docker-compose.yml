# Local observability stack for Schema Field Mapper (backlog item P0-4).
#
# Brings up the full signal path so you can develop against the same shape of
# telemetry you will run in production:
#   app --OTLP--> collector --> Prometheus (metrics)
#                          --> Loki       (logs)
#                          --> Tempo      (traces)
#   app --SDK---> Langfuse (LLM traces, tokens, cost, prompts, evals)
#   Grafana reads Prometheus + Loki + Tempo with trace<->log correlation wired.
#
# Splunk is deliberately NOT here — use the HEC exporter against a real dev
# instance (P2-1). Loki is the local stand-in and stays as the cheap hot tier
# in production.
#
#   make obs-up      docker compose -f deploy/observability/docker-compose.yml up -d
#   Grafana          http://localhost:3000   (admin/admin)
#   Langfuse         http://localhost:3001
#   Prometheus       http://localhost:9090

name: sfm-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC — point SFM_OTEL_ENDPOINT here
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint for exported metrics
    depends_on: [loki, tempo]

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes: [loki-data:/loki]

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # Enables the trace-to-logs and logs-to-trace correlation described in
      # PROD-PLATFORM-CONFLUENCE.md section 6.
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, tempo]

  # --- Langfuse and its dependencies -------------------------------------
  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes: [langfuse-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: default
    volumes: [langfuse-clickhouse-data:/var/lib/clickhouse]

  langfuse-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "langfuse"]

  langfuse-minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes: [langfuse-minio-data:/data]
    ports: ["9001:9001"]

  # One-shot: creates the bucket LANGFUSE_S3_EVENT_UPLOAD_BUCKET below
  # expects. MinIO doesn't auto-create buckets — without this, Langfuse's
  # first trace upload throws "NoSuchBucket" and (given LANGFUSE_S3_EVENT_
  # UPLOAD_REGION's fix above) crashes the process on the unhandled
  # rejection. Found by actually sending a trace through the stack. The
  # base minio/minio image has no healthcheck tooling to depend on, so
  # this polls the alias itself rather than trusting a container-health
  # signal that doesn't exist.
  langfuse-minio-init:
    image: minio/mc:latest
    entrypoint: ["sh", "-c"]
    command: >
      "until mc alias set local http://langfuse-minio:9000 minio miniosecret; do sleep 1; done &&
       mc mb local/langfuse --ignore-existing"
    depends_on:
      langfuse-minio: {condition: service_started}

  langfuse:
    image: langfuse/langfuse:3
    depends_on:
      langfuse-db: {condition: service_healthy}
      langfuse-minio-init: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      # Langfuse 3's migration runner needs the native-protocol URL
      # separately from the HTTP one above — missing this fails startup
      # with "CLICKHOUSE_MIGRATION_URL is not configured" (found by
      # actually starting the stack, not in the original compose file).
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000/default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      # Migrations default to `ON CLUSTER` DDL, which needs Zookeeper — this
      # single ClickHouse node has none. Also found by actually starting
      # the stack: "There is no Zookeeper configuration in server config".
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://:langfuse@langfuse-redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      # The AWS SDK v3 client Langfuse uses refuses to sign any S3 request
      # without a region, even against MinIO, which doesn't validate it —
      # missing this throws an unhandled "Region is missing" rejection that
      # kills the whole Node process on the first real trace upload. Found
      # by actually sending a trace through the stack, not in the original
      # compose file.
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      # CHANGE BOTH before any shared deployment. Local dev values only.
      NEXTAUTH_SECRET: local-dev-only-change-me
      SALT: local-dev-only-change-me
      NEXTAUTH_URL: http://localhost:3001
      TELEMETRY_ENABLED: "false"
    ports: ["3001:3000"]

  # The `langfuse` web container only accepts/queues events — a separate
  # worker is what actually drains the ingestion queue into ClickHouse.
  # Without this, `langfuse.flush()` succeeds, nothing errors, and traces
  # still never appear ("Waiting for first trace" forever) — found by
  # actually sending a trace through the stack and confirming it never
  # showed up, not something the original compose file's absence of a
  # worker service would have told you up front.
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    depends_on:
      langfuse-db: {condition: service_healthy}
      langfuse-minio-init: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000/default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://:langfuse@langfuse-redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      SALT: local-dev-only-change-me
      TELEMETRY_ENABLED: "false"

  # --- LLM gateway (backlog item P1-5) -----------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
    ports: ["4000:4000"]

  # --- Application dependencies ------------------------------------------
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sfm
      POSTGRES_PASSWORD: sfm
      POSTGRES_DB: sfm
    ports: ["5432:5432"]
    volumes: [sfm-db-data:/var/lib/postgresql/data]

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  redis-data:
  sfm-db-data:
  langfuse-db-data:
  langfuse-clickhouse-data:
  langfuse-minio-data:
