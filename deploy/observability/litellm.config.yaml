# LiteLLM Proxy config (backlog item P1-5). Routes both backends this repo
# already supports through one gateway — not wired into pipeline/llm_client.py
# yet; that's the P1-5 acceptance criteria (virtual keys, budgets, failover).
model_list:
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: qwen2.5-7b-ollama
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true
