# Scrapes the OTel Collector's Prometheus exporter (see otel-collector.yaml's
# `prometheus` exporter on :8889). This is the only scrape target until the
# pipeline itself emits OTel metrics directly (backlog item P0-3).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
